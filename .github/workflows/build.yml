name: Build T3 Code
run-name: Build ${{ inputs.ref || 'main head' }}

# Builds the fork's `main` branch (its own code on top of `vetted`, the upstream
# code vet.sh approved) and publishes one release here. Upstream workflows never
# run: this repository holds only this file, and Actions stay disabled on the fork.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit on `main` to build. Empty builds the head of `main`."
        required: false
        type: string
      force:
        description: "Rebuild and replace the release if this commit was already built."
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ inputs.ref || 'head' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_REPO: petervas8/t3code-vetted
  SOURCE_BRANCH: main
  UPSTREAM_REPO: pingdotgg/t3code

jobs:
  resolve:
    name: Resolve commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      vetted: ${{ steps.r.outputs.vetted }}
      version: ${{ steps.r.outputs.version }}
      release_tag: ${{ steps.r.outputs.release_tag }}
      existing: ${{ steps.r.outputs.existing }}
      skip: ${{ steps.r.outputs.skip }}
    steps:
      - id: r
        env:
          TOKEN: ${{ secrets.VETTED_REPO_TOKEN }}
          INPUT_REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "::error::Add the VETTED_REPO_TOKEN secret (read access to $SOURCE_REPO). See README.md."
            exit 1
          fi
          # Commits only, no trees or blobs: enough to see where main's upstream code came from.
          # The token is in this throwaway directory's config; this job runs no source code.
          git init -q "$RUNNER_TEMP/graph" && cd "$RUNNER_TEMP/graph"
          git remote add src "https://x-access-token:${TOKEN}@github.com/${SOURCE_REPO}.git"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch -q --filter=tree:0 --no-tags src "+refs/heads/${SOURCE_BRANCH}:refs/remotes/src/${SOURCE_BRANCH}" \
            "+refs/heads/vetted:refs/remotes/src/vetted"
          git fetch -q --filter=tree:0 --no-tags upstream "+refs/heads/main:refs/remotes/upstream/main"

          if [[ -n "$INPUT_REF" ]]; then
            sha="$(git rev-parse --verify "${INPUT_REF}^{commit}")" || { echo "::error::Unknown commit $INPUT_REF"; exit 1; }
            git merge-base --is-ancestor "$sha" "src/$SOURCE_BRANCH" || { echo "::error::$INPUT_REF is not on $SOURCE_BRANCH"; exit 1; }
          else
            sha="$(git rev-parse "src/$SOURCE_BRANCH")"
          fi
          vetted="$(git rev-parse src/vetted)"

          # Upstream code reaches main only through vetted, which moves only through vet.sh approve.
          unvetted="$(git rev-list "$sha" ^src/vetted | grep -Fxf <(git rev-list upstream/main ^src/vetted) || true)"
          if [[ -n "$unvetted" ]]; then
            echo "::error::${SOURCE_BRANCH} at ${sha:0:12} has $(wc -l <<<"$unvetted") upstream commit(s) that vetted lacks, for example $(head -n1 <<<"$unvetted"). Bring upstream in through vet.sh."
            exit 1
          fi
          cd - >/dev/null; rm -rf "$RUNNER_TEMP/graph"

          base="$(curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${SOURCE_REPO}/contents/apps/server/package.json?ref=${sha}" | jq -r .version)"
          # package.json holds the last stable release; upstream nightlies build the next patch
          # (scripts/resolve-nightly-release.ts), so 0.1.8 on main ships as 0.1.9-nightly.*.
          [[ "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-+].*)?$ ]] || { echo "::error::Unexpected version $base"; exit 1; }
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-vetted.${GITHUB_RUN_NUMBER}"
          # T3 Code downloads release files from releases/download/v<version>/, so the tag is
          # v<version>. A commit's earlier builds are found by its full SHA in their notes.
          release_tag="v${version}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select((.body // \"\") | contains(\"${sha}\")) | .tag_name")"

          skip=false
          if [[ -n "$existing" && "$FORCE" != true ]]; then
            echo "::notice::${sha:0:12} is already released as $(head -n 1 <<<"$existing"). Run with force to rebuild."
            skip=true
          fi

          {
            echo "sha=$sha"; echo "vetted=$vetted"; echo "version=$version"
            echo "release_tag=$release_tag"; echo "existing=$(tr '\n' ' ' <<<"$existing")"; echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"
          echo "Building $SOURCE_BRANCH at $sha (vetted ${vetted:0:12}) as $version" >> "$GITHUB_STEP_SUMMARY"

  # Server bundle, web client and Electron main. Platform independent, so the
  # desktop jobs share it.
  bundle:
    name: JS bundle
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      # Plain git, not actions/checkout: its credential cleanup runs a submodule
      # foreach that fails on the orphaned gitlinks under .repos/. The token is
      # only on this fetch's command line and never lands in git config.
      - &checkout
        name: Checkout source
        env:
          TOKEN: ${{ secrets.VETTED_REPO_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git fetch -q --no-tags --depth=1 "https://x-access-token:${TOKEN}@github.com/${SOURCE_REPO}.git" "$SHA"
          # Vendored references are never reviewed, so they never reach the build.
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout -q --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
          # T3 Connect's public Clerk and relay identifiers. Without them the apps
          # never load a cloud session and every T3 Connect route stays pending.
          cp .env.example .env
          for key in CLERK_PUBLISHABLE_KEY CLERK_JWT_TEMPLATE CLERK_CLI_OAUTH_CLIENT_ID RELAY_URL; do
            grep -q "^T3CODE_${key}=." .env || { echo "::error::.env.example lacks T3CODE_${key}"; exit 1; }
          done

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - run: node scripts/update-release-package-versions.ts "$VERSION"

      - run: vp run build:desktop:bundle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux x64 desktop + server
    needs: [resolve, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - *checkout

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - run: node scripts/update-release-package-versions.ts "$VERSION"

      - &download_bundle
        name: Download JS bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config libgtk-3-0t64 libnss3 libasound2t64 libgbm1 imagemagick patchelf

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      # The desktop build brands its own copy; the server archive ships this one.
      - run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build server executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build server archive
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$dir/"
          node scripts/build-cli-archive.ts \
            --platform linux --arch x64 --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test server archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      # AppImage also produces the .deb.
      - name: Build desktop app
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: vp run dist:desktop:artifact --platform linux --target AppImage --arch x64 --build-version "$VERSION" --skip-build --verbose

      - &collect
        name: Collect assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          for f in release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.blockmap release/*.yml release-cli/*; do
            [[ "$f" == *builder-debug.yml ]] || cp "$f" out/
          done
          ls -la out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: assets-linux-x64
          path: out/*
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS arm64 desktop
    needs: [resolve, bundle]
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - *checkout

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - run: node scripts/update-release-package-versions.ts "$VERSION"

      - *download_bundle

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target aarch64-apple-darwin

      # No Apple secrets, so the app is signed ad hoc and not notarized.
      - name: Build desktop app
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --build-version "$VERSION" --skip-build --verbose

      - *collect

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: assets-mac-arm64
          path: out/*
          if-no-files-found: error
          compression-level: 0

  android:
    name: Android APK (unsigned)
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - *checkout

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile...

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-

      # Updates off: the app would otherwise pull unvetted JS from upstream's
      # Expo project over the air on every launch.
      - name: Generate native project
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          T3CODE_MOBILE_UPDATES_ENABLED: "0"
          EXPO_NO_GIT_STATUS: "1"
        run: ./node_modules/.bin/expo prebuild --clean --platform android

      - name: Build APK
        working-directory: apps/mobile/android
        env:
          APP_VARIANT: production
          T3CODE_MOBILE_UPDATES_ENABLED: "0"
          NODE_ENV: production
        run: ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-unsigned
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  # Signs in a job that runs none of the audited code, so the keystore never
  # shares a runner with build scripts.
  android_sign:
    name: Sign Android APK
    needs: [resolve, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-unsigned
          path: in

      - name: Sign
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE" || -z "$KEY_ALIAS" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS and ANDROID_KEYSTORE_PASSWORD secrets. See README.md."
            exit 1
          fi
          : "${ANDROID_KEY_PASSWORD:=$ANDROID_KEYSTORE_PASSWORD}"
          export ANDROID_KEY_PASSWORD
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          ks="$RUNNER_TEMP/release.jks"
          (umask 077 && printf '%s' "$KEYSTORE" | base64 --decode > "$ks")
          trap 'rm -f "$ks"' EXIT
          mkdir -p out
          "$apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "out/T3-Code-${VERSION}-android-arm64.apk" in/app-release.apk
          "$apksigner" verify --print-certs "out/T3-Code-${VERSION}-android-arm64.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: assets-android
          path: out/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    needs: [resolve, linux, macos, android_sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: assets-*
          path: assets
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          EXISTING: ${{ needs.resolve.outputs.existing }}
          VETTED: ${{ needs.resolve.outputs.vetted }}
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          (cd assets && sha256sum * > SHA256SUMS)
          for old in $EXISTING; do
            gh release delete "$old" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
          gh release create "$RELEASE_TAG" assets/* -R "$GITHUB_REPOSITORY" \
            --title "T3 Code $VERSION" \
            --notes "Built from \`$SOURCE_BRANCH\` at $SHA of $SOURCE_REPO. Upstream code: \`vetted\` at ${VETTED:0:12}."
